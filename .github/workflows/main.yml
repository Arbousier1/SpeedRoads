name: Java CI with Maven (Java 21)

on:
  push:
    branches: [ "master", "main" ] # 当推送到 master 或 main 分支时触发
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # 允许手动点击运行

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 必须赋予写入 Packages 的权限

    steps:
      # 1. 拉取源代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Java 21 环境
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # 推荐的开源发行版
          server-id: github     # 对应 pom.xml 中 distributionManagement 的 server id
          settings-path: ${{ github.workspace }} # 在工作区生成 settings.xml
          cache: 'maven'        # 自动缓存 Maven 依赖，加快下次构建速度

      # 3. 构建项目 (跳过测试以加快速度，如需测试请删除 -DskipTests)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. 发布到 GitHub Packages
      # 仅在推送到主分支时执行发布操作
      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 使用 GitHub 自动生成的 Token
